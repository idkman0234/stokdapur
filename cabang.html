<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Simple</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px;
        }

        header {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            color: #777;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Tampilan tablet */
        @media (max-width: 800px) {
            .container {
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Tampilan HP */
        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>Dashboard</h1>
            <p>Selamat datang 👋</p>
        </header>

        <div class="cards">

            <div class="card">
                <h2>Penjualan</h2>
                <div class="number">Rp 2.5jt</div>
            </div>

            <div class="card">
                <h2>Pesanan</h2>
                <div class="number">128</div>
            </div>

            <div class="card">
                <h2>Stok</h2>
                <div class="number">85%</div>
            </div>

        </div>

        <div class="card" style="margin-top: 15px;">
            <h2>Menu</h2>

            <button onclick="alert('Tombol ditekan!')">
                Buka Menu
            </button>
        </div>

    </div>

</body>
</html>
